[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pychronicle"
version = "0.1.0"
description = "An AST-assisted, SQLite-backed time-travel debugger for Python scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50",
]
authors = [{ name = "PyChronicle Team" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
pychronicle = "pychronicle.cli.commands:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pychronicle.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"