[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pychronicle"
version = "0.4.0"
description = "PyChronicle — AST-Powered Time-Travel Debugger"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
pychronicle = "pychronicle.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
