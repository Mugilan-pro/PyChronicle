[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pychronicle"
version = "1.0.0"
description = "AST-Powered Time-Travel Debugger for Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PyChronicle Team", email = "dev@pychronicle.local"}
]
keywords = [
    "debugger",
    "time-travel",
    "ast",
    "metaprogramming",
    "delta-compression",
    "textual",
    "tui",
    "developer-tools"
]
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "textual>=0.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "anyio>=3.7.0"
]

[project.scripts]
pychronicle = "pychronicle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pychronicle*"]
